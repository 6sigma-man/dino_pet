<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- 禁止加载任何远程资源（SKILL §8 / TECH_DESIGN §24） -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>DinoPet Settings</title>
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0; padding: 16px 18px;
      font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
      font-size: 13px; color: #2b2b2b; background: #f4f4f6;
    }
    h1 { font-size: 15px; margin: 0 0 12px; }
    fieldset { border: 1px solid #dcdce2; border-radius: 8px; margin: 0 0 12px; padding: 10px 12px; }
    legend { font-size: 12px; color: #6b6b73; padding: 0 4px; }
    .row { display: flex; align-items: center; justify-content: space-between; margin: 6px 0; gap: 10px; }
    .row label { flex: 1; }
    select { padding: 3px 6px; border: 1px solid #c9c9d1; border-radius: 5px; background: #fff; }
    input[type="checkbox"] { width: 16px; height: 16px; }
    .hint { color: #8a8a92; font-size: 11px; }
    #status { height: 16px; color: #2f8f4e; font-size: 12px; margin-top: 4px; }
  </style>
</head>
<body>
  <h1 data-i18n="settings.heading">🦖 DinoPet Settings</h1>

  <fieldset>
    <legend data-i18n="settings.group.language">Language</legend>
    <div class="row">
      <label for="language" data-i18n="settings.language">Interface language</label>
      <select id="language">
        <option value="en" data-i18n="lang.en">English</option>
        <option value="zh" data-i18n="lang.zh">简体中文</option>
      </select>
    </div>
  </fieldset>

  <fieldset>
    <legend data-i18n="settings.group.movement">Movement</legend>
    <div class="row">
      <label for="direction" data-i18n="settings.direction">Direction</label>
      <select id="direction">
        <option value="clockwise" data-i18n="dir.clockwise">Clockwise</option>
        <option value="counterclockwise" data-i18n="dir.counterclockwise">Counterclockwise</option>
        <option value="random" data-i18n="dir.random">Random</option>
      </select>
    </div>
    <div class="row">
      <label for="speed" data-i18n="settings.speed">Speed</label>
      <select id="speed">
        <option value="slow" data-i18n="speed.slow">Slow</option>
        <option value="normal" data-i18n="speed.normal">Normal</option>
        <option value="fast" data-i18n="speed.fast">Fast</option>
      </select>
    </div>
  </fieldset>

  <fieldset>
    <legend data-i18n="settings.group.behavior">Behavior</legend>
    <div class="row">
      <label for="behavior" data-i18n="settings.behavior">Random behaviors (fire / sleep, etc.)</label>
      <input type="checkbox" id="behavior" />
    </div>
  </fieldset>

  <fieldset>
    <legend data-i18n="settings.group.system">System</legend>
    <div class="row">
      <label for="clickThrough" data-i18n="settings.clickThrough">Click-through (does not block the desktop)</label>
      <input type="checkbox" id="clickThrough" />
    </div>
    <div class="row">
      <label for="nightMode" data-i18n="settings.nightMode">Night mode (slow during 23:00–07:00)</label>
      <input type="checkbox" id="nightMode" />
    </div>
    <div class="row">
      <label for="autoStart" data-i18n="settings.autoStart">Start automatically on boot</label>
      <input type="checkbox" id="autoStart" />
    </div>
    <div class="row">
      <label for="monitor" data-i18n="settings.monitor">Target display</label>
      <select id="monitor"></select>
    </div>
    <div class="hint" data-i18n="settings.monitorHint">Display unplug / disconnect auto-fallback is finalized in Phase 9 (T902).</div>
  </fieldset>

  <div id="status"></div>

  <script type="module" src="../../dist/renderer/settings.js"></script>
</body>
</html>
